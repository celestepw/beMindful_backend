# Test-Konfiguration: nutzt eine In-Memory-H2-Datenbank statt der echten PostgreSQL-DB,
# damit Tests ohne Credentials und ohne Netzwerkverbindung laufen (auch im Docker-Build).
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Dummy-Secret, damit @Value("${jwt.secret}") im Test-Kontext aufgelöst werden kann
# (mind. 32 Bytes wegen HMAC-SHA256).
jwt.secret=test-secret-key-fuer-junit-mindestens-32-bytes-lang-1234567890
